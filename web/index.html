<!doctype html>
<html lang="en" data-theme="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Kosmo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Скрываем интерфейс до старта заставки, чтобы не мигал -->
  <script>
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('is-intro');
  </script>
  <script src="js/vendor/refraction.js" defer></script>
  <script src="js/app.js" type="module"></script>
</head>
<body>
  <header class="topbar reveal" style="--d: 4">
    <div class="seg glass" data-refract="0.8" role="radiogroup" aria-label="Design style">
      <span class="seg-thumb" aria-hidden="true"></span>
      <button class="seg-item" type="button" role="radio" data-set-theme="glass" aria-checked="true">
        <svg class="i seg-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Liquid Glass
      </button>
      <button class="seg-item" type="button" role="radio" data-set-theme="material" aria-checked="false">
        <svg class="i seg-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Material You
      </button>
    </div>
  </header>

  <main class="stage">
    <!-- Экран 1: номер телефона -->
    <section class="screen is-active" id="screen-phone" aria-labelledby="phone-title">
      <div class="logo" id="logo" aria-hidden="true">
        <span class="logo-glow"></span>
        <svg class="planet" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="planet-fill" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
              <stop offset="0" class="stop-a"/>
              <stop offset="1" class="stop-b"/>
            </linearGradient>
            <radialGradient id="planet-shade" cx="0.35" cy="0.3" r="0.75">
              <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
              <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
              <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
            </radialGradient>
            <linearGradient id="ring-fill" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" class="stop-a"/>
              <stop offset="1" class="stop-b"/>
            </linearGradient>
          </defs>
          <g transform="rotate(-18 60 60)">
            <!-- задние половины колец: их перекрывает планета -->
            <path class="ring ring-outer" pathLength="1" d="M4 60 A56 15 0 0 1 116 60"/>
            <path class="ring ring-inner" pathLength="1" d="M14 60 A46 11.5 0 0 1 106 60"/>
          </g>
          <g class="planet-body">
            <circle cx="60" cy="60" r="27" fill="url(#planet-fill)"/>
            <circle cx="60" cy="60" r="27" fill="url(#planet-shade)"/>
          </g>
          <g transform="rotate(-18 60 60)">
            <!-- передние половины колец — поверх планеты -->
            <path class="ring ring-outer ring-front" pathLength="1" d="M4 60 A56 15 0 0 0 116 60"/>
            <path class="ring ring-inner ring-front" pathLength="1" d="M14 60 A46 11.5 0 0 0 106 60"/>
          </g>
        </svg>
      </div>
      <h1 class="brand reveal" id="phone-title" style="--d: 0">Kosmo</h1>

      <form id="phone-form" novalidate>
        <div class="field glass reveal" id="phone-field" data-refract="0.7" style="--d: 1">
          <button type="button" class="country-btn" id="country-btn" aria-haspopup="dialog" aria-label="Country: Russia, +7">
            <img class="flag" id="country-flag" src="https://flagcdn.com/ru.svg" alt="" width="26" height="19">
            <span class="dial" id="country-dial">+7</span>
            <svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <span class="field-divider" aria-hidden="true"></span>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="000 000-00-00" aria-label="Phone number">
          <button type="button" class="clear-btn" id="clear-btn" aria-label="Clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" class="clear-bg"/><path class="clear-x" d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/></svg>
          </button>
        </div>

        <button class="btn btn-primary reveal" type="submit" id="submit-btn" style="--d: 2">
          <span class="btn-label">Continue</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <button class="btn btn-secondary glass reveal" type="button" id="qr-btn" data-refract="0.6" style="--d: 3">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.6"/>
            <rect x="14" y="3.5" width="6.5" height="6.5" rx="1.6"/>
            <rect x="3.5" y="14" width="6.5" height="6.5" rx="1.6"/>
            <rect x="14" y="14" width="2.5" height="2.5" rx="0.6"/>
            <rect x="18" y="18" width="2.5" height="2.5" rx="0.6"/>
          </svg>
          Log in with QR code
        </button>
      </form>

      <!-- Только в Material You: исходный цвет динамической палитры -->
      <div class="palette reveal" id="palette" role="radiogroup" aria-label="Dynamic color" style="--d: 4">
        <div class="palette-row" id="palette-row"></div>
        <label class="photo-btn" for="photo-input" aria-label="Color from photo" title="Color from photo">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17.5l4.8-4.3 3.4 3 3.3-3.4 4.5 4.2"/></svg>
        </label>
        <input type="file" id="photo-input" accept="image/*" hidden>
      </div>
    </section>

    <!-- Экран 2: код -->
    <section class="screen" id="screen-code" aria-labelledby="code-title" hidden>
      <button class="icon-btn glass back-btn" type="button" id="back-btn" aria-label="Back" data-refract="0.6">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
      </button>
      <h1 class="code-title" id="code-title">Enter code</h1>
      <div class="otp" id="otp">
        <input id="otp-input" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="6-digit code">
        <div class="otp-cells" aria-hidden="true">
          <span class="otp-cell"></span><span class="otp-cell"></span><span class="otp-cell"></span>
          <span class="otp-cell"></span><span class="otp-cell"></span><span class="otp-cell"></span>
        </div>
      </div>
    </section>
  </main>

  <!-- Нижняя панель: страна / QR -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet glass glass-text" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">Choose country</h2>
      <button class="icon-btn sheet-close" type="button" id="sheet-close" aria-label="Close">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-country">
      <div class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></svg>
        <input type="search" id="country-search" placeholder="Search" aria-label="Search country or code">
      </div>
      <ul class="country-list" id="country-list" role="listbox" aria-label="Countries"></ul>
    </div>
    <div class="sheet-body" id="sheet-qr" hidden>
      <div class="qr-box" id="qr-box"></div>
      <ol class="qr-steps">
        <li>Open Kosmo on your phone</li>
        <li>Settings → Devices → Link device</li>
        <li>Point the camera at this code</li>
      </ol>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
