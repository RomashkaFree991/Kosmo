<!doctype html>
<html lang="ru" data-theme="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Kosmo — вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/vendor/refraction.js" defer></script>
  <script src="js/app.js" type="module"></script>
</head>
<body>
  <!-- Фон: на чёрном несколько тусклых пятен, чтобы стеклу было что преломлять -->
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="topbar">
    <div class="seg glass" data-refract="0.8" role="radiogroup" aria-label="Стиль дизайна">
      <span class="seg-thumb" aria-hidden="true"></span>
      <button class="seg-item" type="button" role="radio" data-set-theme="glass" aria-checked="true">
        <svg class="seg-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        Liquid Glass
      </button>
      <button class="seg-item" type="button" role="radio" data-set-theme="material" aria-checked="false">
        <svg class="seg-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        Material You
      </button>
    </div>
  </header>

  <main class="stage">
    <!-- Экран 1: номер телефона -->
    <section class="screen is-active" id="screen-phone" aria-labelledby="phone-title">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <defs>
            <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" class="logo-stop-a"/>
              <stop offset="1" class="logo-stop-b"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="16" fill="url(#logo-g)"/>
          <ellipse cx="32" cy="32" rx="28" ry="9" transform="rotate(-24 32 32)" fill="none" stroke="url(#logo-g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 12"/>
        </svg>
      </div>
      <h1 id="phone-title">Вход в Kosmo</h1>
      <p class="sub">Укажите код страны и номер телефона</p>

      <form id="phone-form" novalidate>
        <div class="field glass" id="phone-field" data-refract="0.7">
          <button type="button" class="country-btn" id="country-btn" aria-haspopup="dialog" aria-label="Страна: Россия, +7">
            <img class="flag" id="country-flag" src="https://flagcdn.com/ru.svg" alt="" width="28" height="20">
            <span class="dial" id="country-dial">+7</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <span class="field-divider" aria-hidden="true"></span>
          <div class="input-wrap">
            <label class="field-label" for="phone">Номер телефона</label>
            <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="000 000-00-00" aria-describedby="phone-hint">
          </div>
          <button type="button" class="clear-btn" id="clear-btn" aria-label="Очистить номер">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.3 12.9-1.4 1.4L12 13.4l-2.9 2.9-1.4-1.4 2.9-2.9-2.9-2.9 1.4-1.4 2.9 2.9 2.9-2.9 1.4 1.4-2.9 2.9z"/></svg>
          </button>
        </div>
        <p class="hint" id="phone-hint" aria-live="polite">Мы отправим SMS с кодом подтверждения</p>

        <button class="btn btn-primary" type="submit" id="submit-btn">
          <span class="btn-label">Продолжить</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <div class="divider-or" aria-hidden="true"><span>или</span></div>

        <button class="btn btn-secondary glass" type="button" id="qr-btn" data-refract="0.6">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm-3 0h2v3h-2v-3zm5 3h3v2h-3v-2zm-5 2h2v3h-2v-3zm3 1h2v2h-2v-2zm3 1h2v2h-2v-2zm0-6h2v2h-2v-2z"/></svg>
          Войти по QR-коду
        </button>
      </form>

      <!-- Только в Material You: выбор исходного цвета для динамической палитры -->
      <div class="palette" id="palette" aria-label="Динамический цвет">
        <p class="palette-title">Динамический цвет</p>
        <div class="palette-row" id="palette-row" role="radiogroup" aria-label="Исходный цвет"></div>
        <label class="photo-btn" for="photo-input">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg>
          Цвет из фото
        </label>
        <input type="file" id="photo-input" accept="image/*" hidden>
      </div>
    </section>

    <!-- Экран 2: код из SMS -->
    <section class="screen" id="screen-code" aria-labelledby="code-title" hidden>
      <button class="icon-btn glass back-btn" type="button" id="back-btn" aria-label="Назад" data-refract="0.6">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </button>
      <div class="logo logo-sms" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM7 9h2v2H7V9zm4 0h2v2h-2V9zm4 0h2v2h-2V9z"/></svg>
      </div>
      <h1 id="code-title">Введите код</h1>
      <p class="sub">Отправили SMS на <span class="nowrap" id="code-phone"></span></p>
      <div class="otp" id="otp" role="group" aria-label="Код из SMS">
        <input class="otp-cell glass" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Цифра 1">
        <input class="otp-cell glass" inputmode="numeric" maxlength="1" aria-label="Цифра 2">
        <input class="otp-cell glass" inputmode="numeric" maxlength="1" aria-label="Цифра 3">
        <input class="otp-cell glass" inputmode="numeric" maxlength="1" aria-label="Цифра 4">
        <input class="otp-cell glass" inputmode="numeric" maxlength="1" aria-label="Цифра 5">
      </div>
      <button class="link-btn" type="button" id="resend-btn" disabled>Отправить снова через <span id="resend-timer">0:59</span></button>
    </section>
  </main>

  <!-- Нижняя панель: выбор страны / QR -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet glass glass-text" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">Выберите страну</h2>
      <button class="icon-btn sheet-close" type="button" id="sheet-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-country">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
        <input type="search" id="country-search" placeholder="Поиск страны или кода" aria-label="Поиск страны">
      </div>
      <ul class="country-list" id="country-list" role="listbox" aria-label="Страны"></ul>
    </div>
    <div class="sheet-body" id="sheet-qr" hidden>
      <div class="qr-box" id="qr-box"></div>
      <ol class="qr-steps">
        <li>Откройте Kosmo на телефоне</li>
        <li>Настройки → Устройства → Подключить</li>
        <li>Наведите камеру на этот код</li>
      </ol>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
